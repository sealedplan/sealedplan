[project]
name = "sealedplan-workspace"
version = "0.0.0"
description = "Development workspace for the sealedplan monorepo"
requires-python = ">=3.11"
dependencies = ["sealedplan", "sealedplan-mcp"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/sealedplan", "adapters/mcp"]

[tool.uv.sources]
sealedplan = { workspace = true }
sealedplan-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python/sealedplan/src", "python/sealedplan/tests", "adapters/mcp/src", "adapters/mcp/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "S", "PT", "TID"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = [
    "python/sealedplan/src",
    "python/sealedplan/tests",
    "adapters/mcp/src",
    "adapters/mcp/tests",
    "examples",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["python/sealedplan/tests", "adapters/mcp/tests"]
addopts = "-q --strict-markers"
