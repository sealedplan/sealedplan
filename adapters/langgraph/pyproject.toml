[project]
name = "sealedplan-langgraph"
version = "0.1.0.dev0"
description = "Gate LangGraph tools on sealedplan: the plan is the interrupt, resume needs its hash"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["sealedplan", "langgraph>=1.2,<2"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8"]
build-backend = "uv_build"
