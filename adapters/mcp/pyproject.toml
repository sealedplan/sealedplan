[project]
name = "sealedplan-mcp"
version = "0.1.0.dev0"
description = "Serve sealedplan actions as MCP tools: plan, approve the plan hash, drift check, apply"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["sealedplan", "mcp>=2.3,<3"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8"]
build-backend = "uv_build"
